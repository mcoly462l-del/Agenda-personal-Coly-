.seg{display:inline-flex;padding:4px;border-radius:99px;background:#e6edf4}.seg button{padding:10px 22px;border:0;border-radius:99px;background:none;font-weight:600}.seg [aria-selected=true]{background:#fff;color:var(--eb);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px;border-radius:20px;background:#fff;border:1px solid #e1e9f1;display:flex;flex-direction:column;gap:4px}.stat b{font:700 2rem 'Bricolage Grotesque',sans-serif}.stat small{color:var(--mut)}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
.xpb{height:10px;border-radius:99px;background:#e6edf4;overflow:hidden;flex:1}.xpb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--eb),var(--pink));transition:width .5s}
.daily{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:22px 26px;border-radius:22px;background:linear-gradient(120deg,var(--eb),#0a2a6e);color:#fff;margin-bottom:28px}.daily p{opacity:.85}.daily .sbtn.s{background:var(--peach);color:#0a2236}.daily .sbtn:disabled{background:rgba(255,255,255,.2);color:#fff}
.lvsec{margin-bottom:28px}.lvsec h2{display:flex;align-items:center;gap:12px;font-size:1.4rem;max-width:none;margin-bottom:14px;flex-wrap:wrap}.lvsec h2 small{font:400 .88rem Figtree;color:var(--mut)}
.lvb{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font:700 .8rem Figtree;background:var(--eb)}.lvb.A2{background:var(--pink)}.lvb.B1{background:#8b3a0e}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:20px;border-radius:20px;border:1.5px solid #e1e9f1;background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s}.lcard:hover:not(:disabled){transform:translateY(-4px);border-color:var(--eb);box-shadow:0 20px 30px -22px rgba(29,111,255,.6)}.lcard:disabled{opacity:.5;cursor:not-allowed}.lcard.done{background:#f0f8f4;border-color:#bfe6d2}.lcard b{font-size:1.1rem}.lcard small{color:var(--mut)}.lst i{font-style:normal;color:#d5dde5}.lst i.f{color:#f5a623}
.back{margin-bottom:12px}.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:260px;margin:22px 0;padding:30px;border-radius:28px;border:0;background:#fff;box-shadow:0 30px 60px -36px rgba(10,34,54,.5);border:1px solid #e1e9f1;transition:transform .4s,background .3s;text-align:center}.fcard b{font:700 clamp(1.8rem,5vw,2.8rem) 'Bricolage Grotesque',sans-serif}.fcard small{color:var(--mut)}.fcard.flip{background:linear-gradient(135deg,var(--eb),#0a2a6e);color:#fff}.fcard.flip small{color:rgba(255,255,255,.8)}
.fnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0}
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:28px}.qp{font-size:1.3rem;max-width:none;margin-bottom:14px;color:var(--mut);font-family:Figtree;letter-spacing:0;font-weight:500}.qq{display:flex;align-items:center;gap:14px;margin-bottom:22px}.qq b{font:700 clamp(1.8rem,5vw,2.6rem) 'Bricolage Grotesque'}
.bigplay{display:grid;place-items:center;width:110px;height:110px;margin:10px auto 24px;border-radius:50%;border:0;background:var(--eb);color:#fff;font-size:2.4rem;box-shadow:0 20px 40px -16px rgba(29,111,255,.7)}
.qopts{display:grid;gap:10px}.qo{padding:16px 20px;border-radius:16px;border:1.5px solid #cddae4;background:#fff;text-align:left;font-size:1.05rem;transition:border-color .2s,background .2s}.qo:hover:not(:disabled){border-color:var(--eb);background:#f0f6ff}.qo.right{background:#e0f5ec;border-color:var(--ok)}.qo.wrong{background:#fde4e8;border-color:var(--bad)}.qo:disabled{cursor:default}
.tform{display:flex;gap:10px;flex-wrap:wrap}.tform input{flex:1;min-width:200px;height:54px;padding:0 20px;border:1.5px solid #cddae4;border-radius:99px;font-size:1.1rem}
.qfb{margin-top:18px}.qfb.good,.qfb.bad{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:16px;animation:rise .3s both}.qfb.good{background:#e0f5ec;color:#0b5a3f}.qfb.bad{background:#fde4e8;color:#8f1d31}
.bigscore{font:700 3rem 'Bricolage Grotesque'}.bigscore small{font:400 1rem Figtree;color:var(--mut)}.res{padding:30px 0}

/* ====== VR ====== */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.vcard{display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:#fff;border:1px solid #e1e9f1;transition:transform .3s,box-shadow .3s}.vcard:hover{transform:translateY(-6px);box-shadow:0 30px 44px -30px rgba(10,34,54,.5)}
.vthumb{display:grid;place-items:center;aspect-ratio:16/10;font-size:4rem;background:linear-gradient(135deg,#0b3a5a,#17608c)}.vthumb.v1{background:linear-gradient(135deg,#8b3a0e,#f43f8b)}.vthumb.v2{background:linear-gradient(135deg,#0f6b4d,#7fd0f2)}
.vinfo{display:flex;flex-direction:column;gap:10px;padding:22px;flex:1}.vinfo h2{font-size:1.4rem;max-width:none}.vinfo p{color:var(--mut);flex:1}.vinfo small{color:#6b7c8c}.vnote{margin-top:28px;max-width:46em}
.vr.sim{padding:0;display:flex;flex-direction:column;min-height:calc(100vh - 72px)}
.vstage{position:relative;flex:1;min-height:52vh;background:#cfe3f1}.vstage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.vtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(rgba(10,34,54,.75),transparent);color:#fff}.vtop b{flex:1}
.vnpc{position:absolute;left:50%;top:16%;transform:translateX(-50%);padding:4px 14px;border-radius:99px;background:rgba(10,34,54,.8);color:#fff;pointer-events:none;white-space:nowrap}
.vfail{position:absolute;inset:auto 20px 20px;background:#fff;padding:12px;border-radius:12px}
.vdlg{padding:22px clamp(16px,4vw,48px) 28px;background:#0a2236;color:#fff;display:grid;gap:14px;max-width:100%}.vsay{font-size:1.15rem;max-width:56em}
.vopts{display:grid;gap:10px;max-width:56em}.vo{padding:14px 18px;border-radius:16px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;text-align:left;font-size:1rem;transition:background .2s,border-color .2s}.vo:hover{background:rgba(255,255,255,.16);border-color:var(--peach)}
.vfb{padding:16px 20px;border-radius:16px;max-width:56em}.vfb.good{background:#14573f}.vfb.mid{background:#6b5000}.vfb.bad{background:#7a1f30}.vfb p{margin-top:6px}.vfb .best{opacity:.9}
.vdlg .sbtn{justify-self:start}.vsum .bigscore{color:var(--peach)}.vsum .muted{color:rgba(255,255,255,.75)}.vsum .fnav{justify-content:flex-start}.vdlg .lnk{color:var(--peach);justify-self:start}

/* seguridad de maquetación en móvil: los hijos de cuadrículas pueden encogerse */
.nwg>*,.cogrid>*,.pdp>*,.cwrap>*,.shero .in>*,.two>*,.vgrid>*{min-width:0}

.nwform input{min-width:0;width:100%}.nwform .sbtn{flex:none;padding:0 18px}

<script>
/* NEWCOMER · núcleo: utilidades, API, router (History API), cabecera, toasts */
(function () {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format((c || 0) / 100);
  const NC = window.NC = { $, $$, esc, money, views: {}, user: null, rm: matchMedia('(prefers-reduced-motion:reduce)').matches };

  /* ---------- token de carrito (persistente) ---------- */
  function rnd(n) { const a = new Uint8Array(n); (crypto || msCrypto).getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); }
  NC.cartToken = () => {
    let t = null;
    try { t = localStorage.getItem('nc_cart'); } catch (e) { }
    if (!t || !/^[A-Za-z0-9_-]{16,64}$/.test(t)) { t = rnd(32); try { localStorage.setItem('nc_cart', t); } catch (e) { NC._t = NC._t || t; t = NC._t; } }
    return t;
  };

  /* ---------- API ---------- */
  NC.api = async (method, path, body) => {
    if (window.NC_LOCAL_API) return window.NC_LOCAL_API(method, path, body, NC.cartToken());
    const opt = { method, credentials: 'same-origin', headers: { 'X-Cart-Token': NC.cartToken() } };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let r;
    try { r = await fetch('/api' + path, opt); } catch (e) { throw new Error('No hay conexión con el servidor. Inicia server.py y abre la web desde http://localhost:8000'); }
    let d = {};
    try { d = await r.json(); } catch (e) { }
    if (!r.ok) { const err = new Error(d.error || 'Error inesperado (' + r.status + ')'); err.status = r.status; err.data = d; throw err; }
    return d;
  };

  /* ---------- toasts ---------- */
  NC.toast = (msg, type) => {
    const el = document.createElement('div');
    el.className = 'tst ' + (type || '');
    el.textContent = msg;
    $('#toast').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3800);
  };

  /* ---------- usuario ---------- */
  NC.loadUser = async () => {
    try { NC.user = (await NC.api('GET', '/me')).user; } catch (e) { NC.user = null; }
    NC.userChanged();
  };
  NC.userChanged = () => {
    const a = $('#acct');
    a.setAttribute('aria-label', NC.user ? 'Mi cuenta (' + NC.user.name + ')' : 'Iniciar sesión o crear cuenta');
    a.classList.toggle('on', !!NC.user);
    document.dispatchEvent(new CustomEvent('nc:user'));
  };

  /* ---------- cabecera y menú (código original, ampliado) ---------- */
  const hd = $('#hd'), bt = $('#menu'), nv = $('#nav');
  NC.closeMenu = () => { nv.classList.remove('open'); bt.setAttribute('aria-expanded', 'false'); bt.setAttribute('aria-label', 'Abrir menú'); };
  addEventListener('scroll', () => hd.classList.toggle('s', scrollY > 20), { passive: true });
  bt.onclick = () => { const o = nv.classList.toggle('open'); bt.setAttribute('aria-expanded', o); bt.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú'); };
  nv.onclick = e => { if (e.target.closest('a')) NC.closeMenu(); };
  addEventListener('keydown', e => { if (e.key === 'Escape') NC.closeMenu(); });

  /* ---------- router ---------- */
  const SA = !!window.NC_STANDALONE;   // versión de un solo archivo: rutas con #/ y API simulada en el navegador
  NC.path = () => SA ? ((location.hash.startsWith('#/') ? location.hash.slice(1) : '/').split('?')[0]) : location.pathname;
  NC.search = () => SA ? '?' + (location.hash.split('?')[1] || '') : location.search;
  const TITLES = { home: 'NEWCOMER · Llegar no es suficiente, NEWCOMER es el puente', newia: 'NEWIA · Asistente virtual · NEWCOMER', academia: "Acadèmia d'idiomes · NEWCOMER", store: 'NEWCOMER STORE', vr: 'Laboratori VR · NEWCOMER' };
  let current = null;
  function parse(path) {
    const p = path.replace(/\/+$/, '') || '/';
    if (p === '/') return ['home', ''];
    const m = p.match(/^\/(newia|academia|store|vr)(\/.*)?$/);
    return m ? [m[1], m[2] || ''] : ['home', ''];
  }
  NC.route = function (fromPop) {
    const [v, sub] = parse(NC.path());
    if (current && current !== v && NC.views[current] && NC.views[current].leave) NC.views[current].leave();
    $$('.view').forEach(el => { el.hidden = el.id !== 'v-' + v; });
    document.body.dataset.view = v;
    $$('#nav a').forEach(a => { const on = a.dataset.v === v; a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
    document.title = TITLES[v];
    current = v;
    if (v !== 'home' && NC.views[v]) NC.views[v].render($('#v-' + v), sub, new URLSearchParams(NC.search()));
    NC.closeDrawer && NC.closeDrawer(true);
    NC.closeMenu();
    if (!fromPop) scrollTo(0, 0);
    document.dispatchEvent(new CustomEvent('nc:route', { detail: { view: v, sub } }));
  };
  NC.go = url => { if (SA) { if (location.hash === '#' + url) NC.route(); else location.hash = '#' + url; } else { history.pushState({}, '', url); NC.route(); } };
  addEventListener(SA ? 'hashchange' : 'popstate', () => NC.route(true));
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || a.target || a.hasAttribute('download')) return;
    const raw = a.getAttribute('href');
    if (raw.startsWith('#') && raw.length > 1) {       // anclas dentro de la portada (original)
      e.preventDefault();
      const go = () => { const t = document.querySelector(raw); if (t) t.scrollIntoView({ behavior: NC.rm ? 'auto' : 'smooth' }); };
      if (NC.path() !== '/') { NC.go('/'); setTimeout(go, 50); } else go();
      return;
    }
    if (SA) { if (raw.startsWith('/') && !raw.startsWith('/api/') && !raw.startsWith('/uploads/')) { e.preventDefault(); NC.go(raw); } return; }
    const u = new URL(a.href, location.href);
    if (u.origin !== location.origin || u.pathname.startsWith('/api/') || u.pathname.startsWith('/uploads/')) return;
    if (u.pathname === location.pathname && u.search === location.search && u.hash) { e.preventDefault(); const t = document.querySelector(u.hash); if (t) t.scrollIntoView({ behavior: NC.rm ? 'auto' : 'smooth' }); return; }
    e.preventDefault();
    history.pushState({}, '', u.pathname + u.search + u.hash);
    NC.route();
  });

  /* utilidades de formulario */
  NC.formData = form => Object.fromEntries(new FormData(form).entries());
  NC.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  NC.stars = (n) => '<span class="stars" aria-label="' + (n || 0) + ' de 5">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= Math.round(n || 0) ? 'f' : '') + '">★</i>').join('') + '</span>';
  NC.fmtDate = iso => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
})();

        } else if (qs.get('edit') !== null) {

              <div class="fld"><label for="f-col">Color base</label><input id="f-col" name="art_color" type="color" value="${esc(ed.art_color)}"></div></div>

              <fieldset class="chk"><legend>Etiquetas y estado</legend>${[['new', 'Novedad'], ['sale', 'Oferta'], ['limited', 'Edición limitada'], ['exclusive', 'Exclusivo']].map(([k, l]) => `<label><input type="checkbox" name="tag_${k}" ${ed.tags.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}

              <label>Popularidad inicial <input type="number" name="popularity" min="0" value="${ed.popularity}" style="width:90px"></label></fieldset>
              <fieldset><legend>Fotografías</legend><div class="imgs">${ed.images.map((u, i) => `<div class="ithumb"><img src="${esc(u)}" alt=""><button type="button" class="lnk" data-rmimg="${i}">Quitar</button></div>`).join('') || '<small class="muted">Sin fotos: se usa la ilustración.</small>'}</div><label class="sbtn g up">Subir foto (PNG, JPG o WebP, máx. 2 MB)<input type="file" id="up" accept="image/png,image/jpeg,image/webp" hidden></label></fieldset>
              <fieldset><legend>Variantes y existencias</legend><div class="vtab">${ed.variants.map((v, i) => `<div class="vrow" data-i="${i}"><input aria-label="Talla o formato" placeholder="Talla" name="size" value="${esc(v.size)}"><input aria-label="Color" placeholder="Color" name="color" value="${esc(v.color)}"><input aria-label="Color (muestra)" type="color" name="hex" value="${esc(v.hex || '#0e84b8')}"><input aria-label="Stock" type="number" min="0" name="stock" value="${v.stock}"><button type="button" class="lnk" data-rmv="${i}" ${ed.variants.length < 2 ? 'disabled' : ''}>Quitar</button></div>`).join('')}</div><button type="button" class="sbtn g" id="addv">Añadir variante</button></fieldset>
              <p class="ferr" id="pferr" role="alert"></p><div class="nav2"><a class="sbtn g" href="/store/admin?tab=productos">Cancelar</a><button class="sbtn s">Guardar producto</button></div></form>`;

          const sync = () => { const f = $('#pf'); if (!f) return; ed.name = f.name.value; ed.category_id = +f.category_id.value; ed.tagline = f.tagline.value; ed.description = f.description.value; ed.art = f.art.value; ed.art_color = f.art_color.value; ed.price_cents = toCents(f.price.value) || 0; ed.compare_cents = f.compare.value ? toCents(f.compare.value) : null;

          <form id="pm" class="copanel" novalidate><h3>Crear descuento</h3><div class="fgrid"><div class="fld"><label for="pcode">Código</label><input id="pcode" name="code" required maxlength="30"></div><div class="fld"><label for="pk">Tipo</label><select id="pk" name="kind"><option value="percent">Porcentaje (%)</option><option value="fixed">Importe fijo (€)</option></select></div><div class="fld"><label for="pv">Valor</label><input id="pv" name="value" required inputmode="decimal"></div><div class="fld"><label for="pmin">Pedido mínimo (€)</label><input id="pmin" name="min" value="0" inputmode="decimal"></div><div class="fld"><label for="pmax">Usos máximos <small>(opcional)</small></label><input id="pmax" name="max_uses" inputmode="numeric"></div><div class="fld"><label for="pex">Caduca <small>(opcional)</small></label><input id="pex" name="expires" type="date"></div></div><button class="sbtn s">Crear descuento</button></form>`;
        $('#pm').onsubmit = async e => { e.preventDefault(); const d = NC.formData(e.target); const val = d.kind === 'percent' ? parseInt(d.value, 10) : toCents(d.value); if (!d.code.trim() || !(val > 0)) return NC.toast('Código y valor son obligatorios', 'err'); if (await run(() => api('POST', '/admin/promos', { code: d.code, kind: d.kind, value: val, min_cents: toCents(d.min || '0') || 0, max_uses: d.max_uses ? parseInt(d.max_uses, 10) : null, expires: d.expires, note: '' }), 'Descuento creado')) reload(); };
        ap.onclick = async e => { const t = e.target.closest('[data-tg]'), d = e.target.closest('[data-dp]'); if (t && await run(() => api('PUT', '/admin/promos/' + t.dataset.tg, { active: t.dataset.on === '1' }))) reload(); if (d && confirm('¿Eliminar el código?') && await run(() => api('DELETE', '/admin/promos/' + d.dataset.dp))) reload(); };

<script>

(function () {

    { id: 'padron', title: 'Empadronamiento', k: ['empadron', 'padron', 'padro', 'empadronar', 'volant', 'volante'], chips: ['tarjeta sanitaria', 'NIE y residencia', 'alquilar piso'],
      a: `**Empadronamiento (padrón municipal)**\nEs tu inscripción en el registro del ayuntamiento donde vives. Sirve para acreditar tu residencia y acceder a servicios como la sanidad, la escuela o algunas ayudas. Las personas extranjeras pueden empadronarse aunque no tengan permiso de residencia.\n\n1. Pide cita en tu ayuntamiento (suele hacerse en la web o por teléfono).\n2. Lleva tu pasaporte o documento de identidad.\n3. Lleva un documento que acredite tu domicilio: contrato de alquiler, escritura o una autorización firmada por la persona titular de la vivienda.\n4. Pide el certificado o volante de empadronamiento: lo necesitarás para muchos otros trámites.` },
    { id: 'sanidad', title: 'Tarjeta sanitaria y salud', k: ['sanitaria', 'sanidad', 'medico', 'metge', 'hospital', 'cap ', 'salud', 'urgencia', 'enfermo', 'catsalut', 'doctor', 'targeta'], chips: ['empadronamiento', 'mapa de ayudas'],
      a: `**Tarjeta sanitaria y atención médica**\nEn caso de **urgencia**, llama al **112** o ve a urgencias: se atiende a cualquier persona.\n\nPara la atención habitual:\n1. Empadrónate en tu municipio (ver «empadronamiento»).\n2. Acude al centro de atención primaria (CAP en Cataluña) que te corresponda por domicilio.\n3. Solicita la tarjeta sanitaria. Pueden pedirte pasaporte o documento de identidad, el volante de empadronamiento y, según tu situación, algún documento más o un tiempo mínimo de empadronamiento.\n\nSi no tienes todos los papeles, pregunta igualmente en el CAP o en servicios sociales: pueden orientarte sobre qué opciones existen.` },
    { id: 'nie', title: 'NIE, TIE y residencia', k: ['nie', 'tie', 'residencia', 'extranjeria', 'permiso', 'papeles', 'arraigo', 'regulariz', 'visado', 'cita previa', 'asilo', 'refugi'], chips: ['empadronamiento', 'buscar trabajo', 'asesoría legal'],
      a: `**NIE, TIE y residencia**\n- El **NIE** es tu número de identidad de extranjero. La **TIE** es la tarjeta que acredita tu autorización de residencia.\n- Estos trámites se gestionan en las **oficinas de Extranjería** o en la **sede electrónica** de la administración, normalmente con **cita previa**.\n- Suele hacer falta: pasaporte, formulario oficial del trámite, justificante del pago de la tasa y los documentos que acrediten tu situación.\n\nExisten distintas vías de residencia (trabajo, estudios, arraigo, reagrupación, protección internacional…) y los requisitos cambian con frecuencia. Lo más seguro es consultar tu caso con un servicio de asesoría jurídica gratuito de una ONG o del colegio de abogados.` },
    { id: 'trabajo', title: 'Buscar trabajo', k: ['trabajo', 'empleo', 'feina', 'curriculum', 'cv', 'entrevista', 'contrato', 'paro', 'sou', 'nomina', 'ofertas', 'laboral', 'trabajar'], chips: ['homologar mi título', 'practicar entrevista (VR)', 'aprender idioma'],
      a: `**Buscar trabajo**\n1. **Currículum:** una página, claro y sin datos innecesarios. Incluye tu experiencia, tus estudios, los idiomas que hablas y tus datos de contacto.\n2. **Dónde buscar:** el servicio público de empleo de tu comunidad (en Cataluña, el SOC / Treball), portales de empleo, entidades sociales y redes de contactos.\n3. **Antes de trabajar:** comprueba qué permiso necesitas para trabajar legalmente y exige siempre un contrato por escrito.\n4. **Entrevista:** practica tus respuestas en voz alta. En el **Laboratori VR** de NEWCOMER puedes ensayar una entrevista simulada.\n\nEn la app NEWCOMER, el apartado «Mundo laboral» reúne ofertas, tu currículum y la homologación de títulos.` },
    { id: 'homolog', title: 'Homologación de títulos', k: ['homolog', 'titulo', 'estudios', 'convalid', 'universidad', 'diploma', 'apostill', 'traduccion', 'equivalencia', 'carrera'], chips: ['buscar trabajo', 'NIE y residencia'],
      a: `**Homologación o equivalencia de títulos**\nEs el procedimiento para que un título obtenido en otro país tenga validez en España. Lo gestiona el **Ministerio de Educación, Formación Profesional y Deportes** (también existen vías para reconocer profesiones reguladas, como medicina o enseñanza).\n\n1. Reúne el título y las notas oficiales de tu país.\n2. Pide que estén **legalizados o apostillados**, según el país de origen.\n3. Encarga una **traducción jurada** si no están en castellano.\n4. Presenta la solicitud en la sede electrónica y guarda el justificante.\n\nEl proceso puede tardar meses. Mientras tanto, hay trabajos que no exigen la homologación: consulta con un servicio de orientación laboral.` },
    { id: 'idioma', title: 'Aprender catalán y castellano', k: ['idioma', 'catalan', 'catala', 'castellano', 'espanol', 'aprender', 'curso', 'clase', 'llengua', 'lengua', 'hablar', 'pronunci', 'vocabulario'], chips: ['abrir la Acadèmia', 'buscar trabajo'],
      a: `**Aprender catalán y castellano**\n- En la **Acadèmia d'idiomes** de NEWCOMER tienes lecciones por niveles, vocabulario con audio, práctica de pronunciación, retos y progreso.\n- Los **Consorcis y servicios de normalización lingüística** y las escuelas de personas adultas ofrecen cursos de catalán (a menudo gratuitos o económicos); las **Escuelas Oficiales de Idiomas** y muchas ONG ofrecen castellano.\n- Truco: practica 10 minutos al día y repite en voz alta. La constancia pesa más que la duración.\n\nPuedes empezar ahora en [Acadèmia d'idiomes](/academia).` },
    { id: 'vivienda', title: 'Alquilar un piso', k: ['alquil', 'piso', 'vivienda', 'lloguer', 'casa', 'habitacion', 'fianza', 'arrend', 'casero', 'inquilin'], chips: ['empadronamiento', 'mapa de ayudas'],
      a: `**Alquilar un piso**\n1. Visita siempre la vivienda antes de pagar nada y desconfía de quien pide dinero por adelantado sin contrato.\n2. Pide un **contrato por escrito** y lee con calma la duración, el precio y los gastos incluidos.\n3. La **fianza** se entrega al firmar; guarda el justificante.\n4. Con el contrato puedes **empadronarte** (ver «empadronamiento»).\n\nSi tienes dudas o crees que te han estafado, acude a los servicios sociales de tu ayuntamiento o a una entidad de apoyo.` },
    { id: 'banco', title: 'Abrir una cuenta bancaria', k: ['banco', 'cuenta bancaria', 'iban', 'tarjeta de credito', 'nomina'], chips: ['NIE y residencia', 'buscar trabajo'],

    initThree(sim); renderStep();
    el.onclick = e => {
      if (e.target.closest('[data-exit]')) return home();
      const o = e.target.closest('[data-o]'); if (o && !cur.fb) return pick(+o.dataset.o);
      if (e.target.closest('[data-next]')) { cur.i++; cur.fb = null; renderStep(); }
      if (e.target.closest('[data-again]')) start(sim);
      if (e.target.closest('[data-all]')) home();
      if (e.target.closest('[data-vr]')) enterXR();
    };
  }
  function renderStep() {
    const c = cur, s = c.sim, st = s.steps[c.i], d = $('#vdlg');
    if (!st) return summary();
    $('#vprog').textContent = (c.i + 1) + ' / ' + s.steps.length;
    d.innerHTML = `<div class="vsay"><b>${esc(s.npc.name.split(' · ')[0])}:</b> ${esc(st.say)}</div><div class="vopts">${st.o.map((o, i) => `<button class="vo" data-o="${i}">${esc(o[0])}</button>`).join('')}</div>${XR ? '<button class="lnk" data-vr>🥽 Entrar en VR</button>' : ''}`;
    if (three) { three.talk = 2.5; three.setPanel && three.setPanel(); }
    d.querySelector('.vo').focus({ preventScroll: true });
  }
  function pick(i) {
    const c = cur, st = c.sim.steps[c.i], o = st.o[i];
    c.fb = o; c.score += o[1]; c.log.push(o[1]);
    const cls = o[1] === 2 ? 'good' : o[1] === 1 ? 'mid' : 'bad';
    $('#vdlg').innerHTML = `<div class="vsay"><b>Tú:</b> ${esc(o[0])}</div><div class="vfb ${cls}" role="status"><b>${o[1] === 2 ? '¡Muy buena respuesta!' : o[1] === 1 ? 'Se puede mejorar' : 'Prueba otra forma'}</b><p>${esc(o[2])}</p>${o[1] < 2 ? `<p class="best"><b>Mejor opción:</b> ${esc(st.o.find(x => x[1] === 2)[0])}</p>` : ''}</div><button class="sbtn s" data-next>${c.i === c.sim.steps.length - 1 ? 'Ver resultado' : 'Continuar'}</button>`;
    $('[data-next]').focus({ preventScroll: true });
    if (three) three.talk = 0;
  }
  function summary() {
    const c = cur, max = c.sim.steps.length * 2, pct = Math.round(c.score / max * 100);
    results[c.sim.id] = Math.max(results[c.sim.id] || 0, pct); try { localStorage.setItem('nc_vr', JSON.stringify(results)); } catch (e) { }
    $('#vprog').textContent = 'Fin';
    $('#vdlg').innerHTML = `<div class="vsum"><h2>${pct >= 80 ? '¡Excelente!' : pct >= 50 ? '¡Buen trabajo!' : 'Sigue practicando'}</h2><p class="bigscore">${pct} % <small>(${c.score} / ${max} puntos)</small></p><p class="muted">${pct >= 80 ? 'Respondiste con claridad y naturalidad.' : 'Repite la simulación y prueba otras respuestas: no hay límite de intentos.'}</p><div class="fnav"><button class="sbtn g" data-again>Repetir</button><button class="sbtn s" data-all>Más simulaciones</button></div></div>`;
  }

  /* ---------- three.js + WebXR ---------- */
  function initThree(sim) {
    if (!window.THREE) { $('#vstage').insertAdjacentHTML('beforeend', '<p class="vfail">No se pudo cargar el motor 3D (¿sin conexión?). Puedes seguir la simulación con el texto.</p>'); return; }
    try {
      const T = THREE, cv = $('#vc'), r = new T.WebGLRenderer({ canvas: cv, antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2));
      const { sc, npc, head, body } = build(sim.room, sim.npc), cam = new T.PerspectiveCamera(55, 1, .1, 50), rig = new T.Group(); rig.position.set(0, 0, 3.2); rig.add(cam); sc.add(rig); cam.position.y = 1.55;
      let yaw = 0, pitch = -.05, drag = false, lx = 0, ly = 0, raf = 0;
      three = { r, talk: 0, sc, rig, cam, T };
      const fit = () => { const b = $('#vstage'); const w = b.clientWidth, h = b.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
      new ResizeObserver(fit).observe($('#vstage')); fit();
      cv.style.touchAction = 'none';
      cv.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
      cv.onpointermove = e => { if (!drag) return; yaw -= (e.clientX - lx) * .005; pitch = Math.max(-.5, Math.min(.4, pitch - (e.clientY - ly) * .004)); lx = e.clientX; ly = e.clientY; };
      cv.onpointerup = cv.onpointercancel = () => drag = false;
      const clock = new T.Clock();
      three.frame = () => {
        const t = clock.getElapsedTime(); three.talk = Math.max(0, three.talk - .016);
        body.scale.y = 1 + .015 * Math.sin(t * 1.6); head.position.y = 1.78 + (three.talk > 0 ? Math.abs(Math.sin(t * 9)) * .03 : .008 * Math.sin(t * 1.6));
        npc.rotation.y = Math.sin(t * .5) * .08;
        if (!r.xr.isPresenting) { cam.rotation.set(pitch, yaw * .6, 0, 'YXZ'); }
        r.render(sc, cam);
      };
      if (NC.rm) three.frame(); else r.setAnimationLoop(three.frame);
      three.stop = () => { r.setAnimationLoop(null); r.dispose(); };
    } catch (e) { console.warn('VR/3D no disponible', e); three = null; }
  }
  function stop() { if (three) { try { if (three.r.xr.getSession && three.r.xr.getSession()) three.r.xr.getSession().end(); three.stop(); } catch (e) { } three = null; } }

  async function enterXR() {
    if (!three || !XR) return NC.toast('Tu dispositivo no admite realidad virtual en este navegador.', 'err');
    try {
      if (!(await navigator.xr.isSessionSupported('immersive-vr'))) return NC.toast('No se detectan gafas de realidad virtual compatibles.', 'err');
      const { r, sc, rig, T } = three; r.xr.enabled = true;
      // panel 3D con el diálogo (textura de canvas) y selección por rayo del mando
      const cvp = document.createElement('canvas'); cvp.width = 1024; cvp.height = 640; const ctx = cvp.getContext('2d'), tex = new T.CanvasTexture(cvp);
      const panel = new T.Mesh(new T.PlaneGeometry(1.6, 1), new T.MeshBasicMaterial({ map: tex, transparent: true })); panel.position.set(0, 1.5, -.9); sc.add(panel); rig.position.set(0, 0, 1.6);
      const hit = []; const wrap = (t, x, y, w, lh) => { const words = t.split(' '); let line = ''; for (const wd of words) { const test = line + wd + ' '; if (ctx.measureText(test).width > w && line) { ctx.fillText(line, x, y); line = wd + ' '; y += lh; } else line = test; } ctx.fillText(line, x, y); return y + lh; };
      three.setPanel = () => {
        ctx.clearRect(0, 0, 1024, 640); ctx.fillStyle = 'rgba(10,34,54,.94)'; ctx.fillRect(0, 0, 1024, 640); hit.length = 0;
        const c = cur, st = c.sim.steps[c.i]; ctx.textBaseline = 'top';
        if (!st) { ctx.fillStyle = '#fdd38a'; ctx.font = '700 44px sans-serif'; ctx.fillText('Simulación terminada', 40, 40); ctx.fillStyle = '#fff'; ctx.font = '32px sans-serif'; ctx.fillText('Resultado: ' + Math.round(c.score / (c.sim.steps.length * 2) * 100) + ' %', 40, 110); tex.needsUpdate = true; return; }
        ctx.fillStyle = '#fdd38a'; ctx.font = '700 30px sans-serif'; ctx.fillText(c.sim.npc.name, 40, 28);
        ctx.fillStyle = '#fff'; ctx.font = '32px sans-serif'; let y = wrap(st.say, 40, 76, 940, 40) + 14;
        if (c.fb) { ctx.fillStyle = c.fb[1] === 2 ? '#7fe3a1' : c.fb[1] === 1 ? '#fdd38a' : '#ff9aa8'; ctx.font = '28px sans-serif'; y = wrap(c.fb[2], 40, y, 940, 36) + 20; ctx.fillStyle = '#1d6fff'; ctx.fillRect(40, 540, 300, 70); ctx.fillStyle = '#fff'; ctx.font = '700 30px sans-serif'; ctx.fillText('Continuar', 78, 560); hit.push({ y0: 540, y1: 610, act: 'next' }); }
        else st.o.forEach((o, i) => { const h = 108; ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(40, y, 944, h - 10); ctx.fillStyle = '#fff'; ctx.font = '26px sans-serif'; wrap(o[0], 56, y + 10, 910, 32); hit.push({ y0: y, y1: y + h - 10, act: i }); y += h; });
        tex.needsUpdate = true;
      };
      three.setPanel();
      const ray = new T.Raycaster();
      [0, 1].forEach(i => { const c = r.xr.getController(i); rig.add(c); c.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0, 0, -2)]), new T.LineBasicMaterial({ color: 0xfdd38a })));
        c.addEventListener('select', () => { const m = new T.Matrix4().extractRotation(c.matrixWorld); ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(m); const h = ray.intersectObject(panel)[0]; if (!h) return; const py = (1 - h.uv.y) * 640; const b = hit.find(x => py >= x.y0 && py <= x.y1); if (!b) return; if (b.act === 'next') { cur.i++; cur.fb = null; renderStep(); } else if (!cur.fb) pick(b.act); three.setPanel(); }); });
      const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
      r.xr.setReferenceSpaceType('local-floor'); await r.xr.setSession(session); r.setAnimationLoop(three.frame);
      session.addEventListener('end', () => { sc.remove(panel); three.setPanel = null; });
    } catch (e) { console.warn(e); NC.toast('No se pudo iniciar la sesión de realidad virtual.', 'err'); }
  }

  NC.views.vr = { render(e) { el = e; document.title = 'Laboratori VR · NEWCOMER'; home(); }, leave: stop };
})();

<script>
const $=s=>document.querySelector(s),K='cc_menu_v1',KT='cc_theme';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=[
{id:'agenda',icon:'📅',name:'Mi agenda personal',desc:'Calendario, estudios, fútbol, gimnasio, hábitos y objetivos.',status:'Activo',kind:'embed',src:'agenda'},
{id:'juego',icon:'🎮',name:'Chapas Arena',desc:'Tu juego de fichas estilo Soccer Stars, con IA y 2 jugadores.',status:'Activo',kind:'embed',src:'agenda',go:'game'},
{id:'web',icon:'🌍',name:'Web NEWCOMER',desc:'Tu página web: proyecto, tienda, Acadèmia y Laboratori VR.',status:'Activo',kind:'embed',src:'web'}];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.items))S={items:DEF.map(x=>({...x,hidden:false}))};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const card=(x,i,hid)=>`<div class="c"><div class="ic">${esc(x.icon)}</div><h3>${esc(x.name)}</h3><span class="st ${x.status=='Activo'?'':'p'}">${esc(x.status)}</span><p>${esc(x.desc)}</p>
<div class="ar">${hid?`<button class="pri" data-a="show" data-i="${x.id}">Mostrar</button>`:`<button class="pri" data-a="open" data-i="${x.id}">Abrir</button>`}
${x.kind=='embed'&&!hid?`<button class="sm" data-a="tab" data-i="${x.id}" title="Abrir en pestaña nueva">↗</button>`:''}
${hid?'':`<button class="sm" data-a="l" data-i="${x.id}" aria-label="Mover antes">◀</button><button class="sm" data-a="r" data-i="${x.id}" aria-label="Mover después">▶</button>`}
<button class="sm" data-a="edit" data-i="${x.id}" aria-label="Editar">✎</button>${hid?'':`<button class="sm" data-a="hide" data-i="${x.id}" aria-label="Ocultar">🙈</button>`}</div></div>`;
function draw(){const v=S.items.filter(x=>!x.hidden),h=S.items.filter(x=>x.hidden);
$('#g').innerHTML=v.map(card).join('')||'<p class="mu">No hay accesos visibles.</p>';
$('#gh').innerHTML=h.map(x=>card(x,0,1)).join('');$('#hd').style.display=h.length?'':'none'}
const src=k=>$('#src-'+k).textContent.replace(/<\\\/script/g,'<'+'/script');
function open_(x){if(x.kind=='link'){window.open(x.url,'_blank','noopener,noreferrer');return}
$('#vt').textContent=x.name;const f=$('#vf');f.srcdoc=src(x.src);$('#v').classList.add('s');
if(x.go)f.onload=()=>{try{const b=f.contentDocument.querySelector('[data-c='+x.go+']');b&&b.click()}catch(e){}};else f.onload=null}
function closeV(){$('#v').classList.remove('s');$('#vf').srcdoc='';$('#vf').onload=null}
function newTab(x){const u=URL.createObjectURL(new Blob([src(x.src)],{type:'text/html'}));window.open(u,'_blank')}
function form(id){const x=id?S.items.find(o=>o.id==id):{icon:'⭐',name:'',desc:'',status:'En desarrollo',kind:'link',url:''};
$('#m').innerHTML=`<div class="md"><h3 style="margin:0">${id?'Editar':'Añadir'} proyecto</h3><form id="fm">
<label>Icono (emoji)</label><input name="icon" maxlength="4" value="${esc(x.icon)}">
<label>Nombre</label><input name="name" required maxlength="60" value="${esc(x.name)}">
<label>Descripción</label><textarea name="desc" rows="2" maxlength="160">${esc(x.desc)}</textarea>
<label>Estado</label><select name="status">${['Activo','En desarrollo','Próximamente'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>
${x.kind=='link'?`<label>Dirección web (https://…)</label><input name="url" type="url" required placeholder="https://" value="${esc(x.url)}">`:''}
<div class="bt">${id&&x.kind=='link'?'<button type="button" data-a="del" data-i="'+x.id+'">Quitar del menú</button>':''}<button type="button" data-a="cl">Cancelar</button><button class="pri">Guardar</button></div></form></div>`;
$('#m').classList.add('s');
$('#fm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
if(d.url&&!/^https?:\/\//i.test(d.url))return alert('La dirección debe empezar por http:// o https://');
if(id)Object.assign(x,d);else S.items.push({id:'p'+Date.now().toString(36),kind:'link',hidden:false,...d});
save();$('#m').classList.remove('s');draw()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(e.target.id=='m')$('#m').classList.remove('s');return}
const a=b.dataset.a,id=b.dataset.i,i=S.items.findIndex(o=>o.id==id),x=S.items[i];
if(a=='open')open_(x);else if(a=='tab')newTab(x);else if(a=='edit')form(id);else if(a=='cl')$('#m').classList.remove('s');
else if(a=='hide'){x.hidden=true;save();draw()}else if(a=='show'){x.hidden=false;save();draw()}
else if(a=='del'){if(confirm('Se quitará solo el acceso del menú. ¿Continuar?')){S.items.splice(i,1);save();$('#m').classList.remove('s');draw()}}
else if(a=='l'||a=='r'){const vis=S.items.filter(o=>!o.hidden),j=vis.indexOf(x),k=j+(a=='l'?-1:1);if(k<0||k>=vis.length)return;
const t=S.items.indexOf(vis[k]);[S.items[i],S.items[t]]=[S.items[t],S.items[i]];save();draw()}});
$('#add').onclick=()=>form();$('#bk').onclick=closeV;
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('#m').classList.remove('s');if($('#v').classList.contains('s'))closeV()}});
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#050a18';r.dataset.theme=d?'light':'dark';try{localStorage.setItem(KT,r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem(KT);if(t)document.documentElement.dataset.theme=t}catch(e){}
draw();
</script></body></html>
